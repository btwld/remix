name: remix
description: Remix is a modern, expressive design system built on top of Naked and Mix.
repository: https://github.com/btwld/remix
documentation: https://docs.page/btwld/remix
issue_tracker: https://github.com/btwld/remix/issues
license: BSD-3-Clause
resolution: workspace
topics:
  - design-system
  - ui
  - widgets
  - styling
  - mix

version: 1.0.0-beta.11

# Consumer floor, matching `mix` and `naked_ui`. Intentionally lower than the
# workspace's own toolchain floor: dev tooling needs a newer SDK than the
# shipped code does, and consumers should not pay for that. Enforced by
# tool/check_toolchain.dart.
environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  mix: ^2.2.0-beta.5
  mix_annotations: ^2.2.0-beta.1
  naked_ui: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.1
  meta: ^1.18.0
  mix_generator: ^2.2.0-beta.3
