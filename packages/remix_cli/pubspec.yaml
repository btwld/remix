name: remix_cli
description: Install editable Remix design-system source into Flutter applications.
repository: https://github.com/conceptadev/remix
issue_tracker: https://github.com/btwld/remix/issues
license: BSD-3-Clause
resolution: workspace
topics:
  - cli
  - design-system
  - flutter
  - remix

version: 0.1.0

environment:
  sdk: ">=3.12.0 <4.0.0"

executables:
  remix: remix

dependencies:
  args: ^2.7.0
  glob: ^2.1.3
  path: ^1.9.1
  pub_semver: ^2.2.0
  yaml: ^3.1.3
  yaml_edit: ^2.2.4

dev_dependencies:
  test: ^1.31.0
