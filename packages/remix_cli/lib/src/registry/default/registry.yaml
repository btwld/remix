  # The only item with non-theme dependencies. A table's selection column is a
  # checkbox, its pager is a pair of icon buttons, and its page-size control is
  # a select, so its recipe hands `DataTableSpec` the application's own recipes
  # rather than restating three components inside a fourth.
  data_table:
    registryDependencies:
      - theme
      - checkbox
      - icon_button
      - select
    dependencies:
      mix_annotations: ^2.2.0-beta.1
    devDependencies:
      build_runner: ^2.10.1
      mix_generator: ^2.2.0-beta.3
    files:
      - source: templates/data_table/data_table.dart.tmpl
        target: "@ui/components/data_table.dart"
    generated:
      - "@ui/components/data_table.g.dart"
    exports:
      - components/data_table.dart

  # A toast's action and close control are the application's own Button and
  # IconButton recipes, handed to `ToastSpec` so they keep their own states.
  toast:
    registryDependencies:
      - theme
      - button
      - icon_button
    dependencies:
      mix_annotations: ^2.2.0-beta.1
    devDependencies:
      build_runner: ^2.10.1
      mix_generator: ^2.2.0-beta.3
    files:
      - source: templates/toast/toast.dart.tmpl
        target: "@ui/components/toast.dart"
    generated:
      - "@ui/components/toast.g.dart"
    exports:
      - components/toast.dart

  # A layout, not a styled component: it has no Spec and installs no
  # generated adapter, so it declares neither `dependencies` (mix_annotations)
  # nor `devDependencies` (build_runner, mix_generator). It still depends on
  # `sidebar` because it composes an already-installed Sidebar into its row
  # and compact sheet, even though its own source never imports that file.
  sidebar_layout:
    registryDependencies:
      - theme
      - sidebar
    files:
      - source: templates/sidebar_layout/sidebar_layout.dart.tmpl
        target: "@ui/components/sidebar_layout.dart"
    exports:
      - components/sidebar_layout.dart

