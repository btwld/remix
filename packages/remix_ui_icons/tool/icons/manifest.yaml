# Source of truth for remix_ui_icons. tool/icons/generate.py reads this file
# and design/icons/{outline,rounded,mono}; every artifact under lib/, the
# migration guide, and the CHANGELOG fragment are generated from it.
#
# Codepoints are not assigned here. They live in codepoints.lock.json, which
# is append-only: a new glyph takes the next free codepoint, a removed glyph
# is retired, and no codepoint is ever reassigned.
schema: 1
package: remix_ui_icons
fontFamily: RemixIcons
startCodepoint: "0xE200"
source:
  root: ../../../../design/icons
  # The #336 revision the drawings were taken from.
  revision: 5ebbbe577d5cb737ccd1150ef4ea56c0cdf91678
reserved:
  # remix_ui_icons 0.1.x shipped the Radix Icons 1.3.2 glyphs here. Never reuse.
  - first: "0xE000"
    last: "0xE13D"
    reason: remix_ui_icons 0.1.x (Radix Icons 1.3.2)
families:
  outline:
    class: OutlineIcons
    label: Outline
  rounded:
    class: RoundedIcons
    label: Rounded
  mono:
    class: MonoIcons
    label: Mono
