name: remix_agent_example
description: WidgetsApp example for remix_agent. Installed recipes style the composer.
publish_to: none
resolution: workspace
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # Added by `remix add`: the installed recipes carry `@MixWidget`.
  mix_annotations: ^2.2.0-beta.1
  # Match the package's own floor. Workspace resolution binds the local
  # siblings, so a stale constraint here compiles and says nothing until
  # someone reads it as the tested version.
  remix: ^1.0.0-beta.10
  remix_ui_icons: ^0.1.0

dev_dependencies:
  build_runner: ^2.10.1
  flutter_test:
    sdk: flutter
  mix_generator: ^2.2.0-beta.3
  # Project-local CLI pin for the application-owned UI source. Workspace
  # resolution uses the local package during development.
  remix_cli: ^0.1.0

flutter:
  uses-material-design: true
