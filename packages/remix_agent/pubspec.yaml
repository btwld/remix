name: remix_agent
description: >
  Agent-run UI surfaces for Remix. Unstyled conversation, permission, and
  progress widgets with no theme, no token scope, and no model SDK.
publish_to: none
repository: https://github.com/btwld/remix
issue_tracker: https://github.com/btwld/remix/issues
license: BSD-3-Clause
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  remix_ui_icons: ^0.1.0
  mix: ^2.2.0-beta.5
  mix_annotations: ^2.2.0-beta.1
  # Match the behavior version exercised by the open-code stack. Workspace
  # resolution binds the local sibling while Agent is private.
  remix: ^1.0.0-beta.10

dev_dependencies:
  build_runner: ^2.10.1
  flutter_test:
    sdk: flutter
  mix_generator: ^2.2.0-beta.3
