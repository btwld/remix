# The icons the registry's templates use, and each one's constant in every
# library a project can choose with `iconLibrary` in remix.yaml.
#
# Schema 2 (remix_cli 1.0.0-beta.1 and later). Keys are canonical names that
# templates refer to as {{icon:<name>}}; they stay stable when a library
# renames its glyph. An icon remix_ui_icons does not draw names Lucide as its
# fallback: a `remix` project renders it from lucide_flutter, which the
# installer then adds. Two of the remix mappings are partial matches, chosen
# for the presets: `code` renders Terminal and `dashboard` renders Grid.
#
# tool/check_registry_icons.dart checks every constant exists in its package,
# and that each remix mapping agrees with remix_ui_icons' migration manifest.
schema: 2
libraries:
  remix:
    dependency:
      remix_ui_icons: ^1.0.0-beta.1
    import: package:remix_ui_icons/remix_ui_icons.dart
    class: RemixIcons
  lucide:
    dependency:
      lucide_flutter: ^1.47.0
    import: package:lucide_flutter/lucide_flutter.dart
    class: LucideIcons
icons:
  activityLog: {lucide: activity, fallback: lucide}
  alignCenterHorizontally: {lucide: alignCenter, fallback: lucide}
  alignLeft: {lucide: alignLeft, fallback: lucide}
  alignRight: {lucide: alignRight, fallback: lucide}
  arrowUp: {remix: arrowUp, lucide: arrowUp}
  barChart: {remix: chart, lucide: barChart3}
  bell: {remix: bell, lucide: bell}
  box: {lucide: box, fallback: lucide}
  chatBubble: {remix: chat, lucide: messageCircle}
  check: {remix: check, lucide: check}
  checkCircled: {lucide: circleCheck, fallback: lucide}
  chevronDown: {remix: chevronDown, lucide: chevronDown}
  chevronUp: {remix: chevronUp, lucide: chevronUp}
  circle: {lucide: circle, fallback: lucide}
  circleBackslash: {lucide: ban, fallback: lucide}
  code: {remix: terminal, lucide: code}
  copy: {remix: copy, lucide: copy}
  cross2: {remix: close, lucide: x}
  crossCircled: {lucide: circleX, fallback: lucide}
  cursorArrow: {lucide: mousePointer2, fallback: lucide}
  dashboard: {remix: grid, lucide: layoutDashboard}
  dotFilled: {lucide: dot, fallback: lucide}
  dotsHorizontal: {remix: more, lucide: ellipsis}
  doubleArrowLeft: {lucide: chevronsLeft, fallback: lucide}
  doubleArrowRight: {lucide: chevronsRight, fallback: lucide}
  download: {remix: download, lucide: download}
  exclamationTriangle: {remix: warning, lucide: triangleAlert}
  fontBold: {lucide: bold, fallback: lucide}
  fontSize: {lucide: type, fallback: lucide}
  gear: {remix: gear, lucide: settings}
  group: {lucide: group, fallback: lucide}
  hamburgerMenu: {remix: menu, lucide: menu}
  heart: {lucide: heart, fallback: lucide}
  infoCircled: {remix: info, lucide: info}
  input: {lucide: formInput, fallback: lucide}
  laptop: {lucide: laptop, fallback: lucide}
  lockClosed: {remix: lock, lucide: lock}
  magicWand: {lucide: wandSparkles, fallback: lucide}
  magnifyingGlass: {remix: search, lucide: search}
  mixerHorizontal: {remix: sliders, lucide: slidersHorizontal}
  mobile: {lucide: smartphone, fallback: lucide}
  moon: {lucide: moon, fallback: lucide}
  person: {remix: user, lucide: user}
  plus: {remix: plus, lucide: plus}
  reload: {remix: refresh, lucide: rotateCcw}
  square: {lucide: square, fallback: lucide}
  stack: {lucide: layers, fallback: lucide}
  sun: {lucide: sun, fallback: lucide}
  table: {lucide: table, fallback: lucide}
  update: {lucide: loaderCircle, fallback: lucide}
