# The icons the registry's templates use, and each one's constant in every
# library a project can choose with `iconLibrary` in remix.yaml.
#
# Schema 2 (remix_cli 1.0.0-beta.1 and later). Keys are canonical names that
# templates refer to as {{icon:<name>}}; they stay stable when a library
# renames its glyph. Both Remix families cover every current registry icon;
# Code and Dashboard are distinct from Terminal and Grid.
#
# tool/check_registry_icons.dart checks every constant exists in its package,
# and that each remix mapping agrees with remix_ui_icons' migration manifest.
schema: 2
libraries:
  remix:
    dependency:
      remix_ui_icons: ^1.0.0-beta.1
    import: package:remix_ui_icons/remix_ui_icons.dart
    class: RemixIcons
  rounded:
    dependency:
      remix_ui_icons: ^1.0.0-beta.1
    import: package:remix_ui_icons/remix_ui_icons.dart
    class: RoundedIcons
  lucide:
    dependency:
      lucide_flutter: ^1.47.0
    import: package:lucide_flutter/lucide_flutter.dart
    class: LucideIcons
icons:
  activityLog: {remix: activity, rounded: activity, lucide: activity}
  alignCenterHorizontally: {remix: alignCenter, rounded: alignCenter, lucide: alignCenter}
  alignLeft: {remix: alignLeft, rounded: alignLeft, lucide: alignLeft}
  alignRight: {remix: alignRight, rounded: alignRight, lucide: alignRight}
  arrowUp: {remix: arrowUp, rounded: arrowUp, lucide: arrowUp}
  barChart: {remix: chart, rounded: chart, lucide: barChart3}
  bell: {remix: bell, rounded: bell, lucide: bell}
  box: {remix: box, rounded: box, lucide: box}
  chatBubble: {remix: chat, rounded: chat, lucide: messageCircle}
  check: {remix: check, rounded: check, lucide: check}
  checkCircled: {remix: checkCircle, rounded: checkCircle, lucide: circleCheck}
  chevronDown: {remix: chevronDown, rounded: chevronDown, lucide: chevronDown}
  chevronRight: {remix: chevronRight, rounded: chevronRight, lucide: chevronRight}
  chevronUp: {remix: chevronUp, rounded: chevronUp, lucide: chevronUp}
  circle: {remix: circle, rounded: circle, lucide: circle}
  circleBackslash: {remix: ban, rounded: ban, lucide: ban}
  code: {remix: code, rounded: code, lucide: code}
  copy: {remix: copy, rounded: copy, lucide: copy}
  cross2: {remix: close, rounded: close, lucide: x}
  crossCircled: {remix: closeCircle, rounded: closeCircle, lucide: circleX}
  cursorArrow: {remix: cursor, rounded: cursor, lucide: mousePointer2}
  dashboard: {remix: dashboard, rounded: dashboard, lucide: layoutDashboard}
  dotFilled: {remix: dotFilled, rounded: dotFilled, lucide: dot}
  dotsHorizontal: {remix: more, rounded: more, lucide: ellipsis}
  doubleArrowLeft: {remix: chevronsLeft, rounded: chevronsLeft, lucide: chevronsLeft}
  doubleArrowRight: {remix: chevronsRight, rounded: chevronsRight, lucide: chevronsRight}
  download: {remix: download, rounded: download, lucide: download}
  exclamationTriangle: {remix: warning, rounded: warning, lucide: triangleAlert}
  fontBold: {remix: bold, rounded: bold, lucide: bold}
  fontSize: {remix: type, rounded: type, lucide: type}
  gear: {remix: gear, rounded: gear, lucide: settings}
  group: {remix: group, rounded: group, lucide: group}
  hamburgerMenu: {remix: menu, rounded: menu, lucide: menu}
  heart: {remix: heart, rounded: heart, lucide: heart}
