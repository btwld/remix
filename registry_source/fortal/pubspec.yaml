name: remix_fortal
description: Fortal is a Radix Themes-inspired preset theme and widget catalog built on Remix.
publish_to: none
repository: https://github.com/btwld/remix
documentation: https://docs.page/btwld/remix/fortal
issue_tracker: https://github.com/btwld/remix/issues
license: BSD-3-Clause
resolution: workspace
topics:
  - design-system
  - ui
  - widgets
  - styling
  - mix

# Retained only so `apps/*` can still declare `remix_fortal: ^1.0.0-beta.9`
# while they migrate to installed source. It goes with the last of those
# dependencies; this package is never published.
version: 1.0.0-beta.9

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  # The workspace resolves this to the sibling source package. The derived
  # registry owns the hosted Remix floor installed into consumer applications.
  remix: ^1.0.0-beta.10
  mix: ^2.2.0-beta.5
  mix_annotations: ^2.2.0-beta.1
  mix_chart: ^0.0.1-beta.1
  remix_ui_icons: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.1
  mix_generator: ^2.2.0-beta.3
