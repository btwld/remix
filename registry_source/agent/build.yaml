targets:
  $default:
    # The nested example is a separate workspace package with its own builders.
    # Including it here lets the combining builder delete its generated parts.
    sources:
      exclude:
        - example/**
    builders:
      mix_generator|mix_generator:
        enabled: true
        generate_for:
          - lib/**/*.dart
      mix_generator|spec_styler_generator:
        enabled: true
        generate_for:
          - lib/**/*.dart
      mix_generator|mix_widget_generator:
        enabled: true
        generate_for:
          - lib/**/*.dart
      mix_generator|styler_generator:
        enabled: false
      mix_generator|mixable_generator:
        enabled: false
      mix_generator|modifier_generator:
        enabled: false
