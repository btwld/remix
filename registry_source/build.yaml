targets:
  $default:
    builders:
      mix_generator|mix_widget_generator:
        enabled: true
        generate_for:
          - lib/**/*.dart
      # Agent components are @MixableSpec sources; the presets are @MixWidget
      # recipes and generate nothing else.
      mix_generator|mix_generator:
        enabled: true
        generate_for:
          - lib/src/agent/**/*.dart
      mix_generator|spec_styler_generator:
        enabled: true
        generate_for:
          - lib/src/agent/**/*.dart
      mix_generator|styler_generator:
        enabled: false
      mix_generator|mixable_generator:
        enabled: false
      mix_generator|modifier_generator:
        enabled: false
