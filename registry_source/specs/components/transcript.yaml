# Agent behavior supplies slots, not visual defaults. These measurements are
# reference benchmarks, not the shipped default/Fortal recipe contract.
# See ../README.md for reconciliation with the authored recipes and
# ../../docs/adr/agent/0001-package-boundary.md for the behavior boundary.
component: Transcript
flutter_name: AgentTranscript
status: behavior implemented (vertical slice); no visual defaults shipped

source:
  ref: live-edge follow/release contract
  files: []
  docs: internal worksheets

anatomy:
  - min-h-0 host
  - h-full clipped scroll viewport
  - child column
  - stable end scrollbar gutter
  - inset focus-visible ring
  - scroll-to-latest icon button (bottom center over the viewport)
states:
  - following
  - released
  - busy
  - focus-visible
tokens: {}
recipe_measurements:
  - followThreshold default 48 logical pixels
  - scrollbar gutter 12
  - focus ring 2 inset, host ink
behavior:
  - Any scroll toward older output releases at once, whatever the input
    (wheel, trackpad, drag, keyboard, scrollbar, focus, host scroll)
  - Re-attach when a scroll reaches the end, or moves toward it and stops
    within threshold
  - Decisions read the position after the scroll moved; the wheel announces
    its direction before it moves
  - Growth is followed inside the layout that grew it (scroll physics), so
    the newest output paints in view without a second frame
  - Nested scrollables (depth > 0) do not release follow
  - Scroll-to-latest appears when released and beyond threshold; it animates
    180ms ease-out to the end and follows again
  - Reduced motion jumps instead of animating
  - Programmatic follow is latched
  - Fills a bounded host; shrink-wraps when unbounded
  - Overscroll is contained (no glow/bounce chaining)
  - Keyboard-focusable; Arrow/Page/Home/End scroll and update follow
  - Focus-visible paints a 2px inset ring from host DefaultTextStyle ink
approximations:
  - overscroll-contain → ClampingScrollPhysics, no overscroll indicator, absorb OverscrollNotification
  - scrollbar-gutter: stable → reserved end padding (12)
  - focus-visible ring-2 ring-inset → 2px inside stroke, host ink
