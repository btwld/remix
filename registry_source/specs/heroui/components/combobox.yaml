apiMapping:
  - "ComboBox maps to RemixCombobox<T>; filtering is optionsBuilder, acceptance is onSelected, editing uses controller/focusNode. Arbitrary text remains valid."
  - "Upstream variant maps to the same primary/secondary field recipes as HeroUiTextField. No React props or collection state are introduced."
  - "Autocomplete's trigger with a search field inside its popover is a separate deferred family; this recipe covers inline editable ComboBox."
approximations:
  - "Remix has no trigger button slot, persistent option selection/checkmark, per-option disabled state or multiple selection. Accepted values appear in the editor; supply eligible suggestions only."
  - "The input has symmetric 12px padding because no optional trigger glyph occupies its end."
  - "Keyboard traversal stays in the editor. The scroll viewport clips outer row rings, so the focused row paints a 2px inset foreground border without consuming layout space, instead of the upstream outer ring and background gap."
  - "The panel uses an 8px gap and Remix's available-space bound/default 288px maximum; upstream ComboBox's popover follows React Aria's placement and available-space policy. Overflow fades and the 35%-muted directional thumb are Remix adaptations."
  - "A bottom margin supplies the 4px inter-row gap and leaves that gap after the final row; upstream applies margin before subsequent rows only."
  - "The panel mounts without upstream's 150ms fade/zoom. Pressed scale changes immediately rather than using the upstream 250ms transform transition."
  - "The source records system sans; review captures use real Geist, with Arial Unicode fallback for Arabic. Flutter and CSS shadow blur kernels differ."
  - "Validation uses a custom fieldBuilder and the TextField error API; RemixCombobox exposes no root invalid/helper-text parameters."
