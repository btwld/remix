component: DashboardDemo
widget: HeroUiDashboardDemo, HeroUiDashboardOverview, HeroUiDashboardCustomersPage, HeroUiDashboardOrdersPage, HeroUiDashboardSettingsPage
target: composition over the shared dashboard demo base
status: implemented
extension: "No dashboard in @heroui/react 3.2.6. The other presets' demo over the shared base, with HeroUI's mapped recipes and the chart, Agent and shell extensions in place of their components."
source:
  ref: none
  derivedFrom: [dashboard_shell.yaml, chart.yaml, card.yaml, table.yaml, chip.yaml, button.yaml, tabs.yaml, search_field.yaml, alert.yaml, modal.yaml, dropdown.yaml, popover.yaml, "*_recipe.yaml"]
anatomy: [shell, breadcrumb, header actions, notifications popover, theme popover, account menu, overview, chat, customers, orders, settings]
variants: []
sizes: {supported: [], default: null}
states: [light, dark, collapsed rail, compact sheet, search filtered, records selected, order filter, settings radius]
tokens:
  - "page: background; cards: the card recipe (surface, surface shadow, radius-panel)"
  - "headings: text-base at Tailwind's 24/32 (h3) and 16/24 (h6), semibold, tracking -0.025em, as HeroUiTypography sets them; body: text-sm and text-xs in foreground and muted"
  - "statuses: soft chips, success (paid, fulfilled, active), warning (pending, in review, invited), danger (cancelled, suspended), default otherwise"
  - "metric deltas: soft sm chips, success up and danger down"
  - "charts: chart.yaml's ramp (accent, muted, foreground); activity marks and empty states on default with default-foreground; unread notifications on default; the unread dot accent ringed in background"
measurements:
  - {what: pages, value: "Overview pads 24 (16 below 600 wide); Customers, Orders and Settings pad 32; sections 20 and 16 apart", cite: "the shared overview base; designed for the rest, as the other presets"}
  - {what: segmented choices, value: "the primary tabs recipe (the segmented pill) for the order filter and both color-mode choices", cite: tabs.yaml}
  - {what: tables, value: "the table recipe: secondary for recent orders on the overview card, primary for Customers and Orders; the customer selection column takes the secondary checkbox", cite: table.yaml}
  - {what: fields on cards, value: "the secondary text field, select and checkbox (default fill), because the primary field fill is the card's own surface", cite: "textfield.yaml, select.yaml, checkbox.yaml"}
  - {what: date and order columns, value: "112 for order numbers on the overview, 136 for dates, so each stays on one line inside the table's 16px cell insets", cite: "designed; table.yaml px-4"}
  - {what: account row, value: "8 padding, radius-2xl, default fill on hover, an inset focus ring; a soft accent sm avatar", cite: "designed"}
  - {what: popovers, value: "288 wide content in the popover recipe", cite: "designed; the other presets' width"}
approximations:
  - "No upstream reference: @heroui/react 3.2.6 ships no dashboard, so the composition and every value above are designed from existing HeroUI tokens and recipes. Listed under `extensions` in reference/heroui_3_2_6/families.json."
  - "Sample data, navigation, copy, keys and behavior are the shared base's, unchanged from Vanilla and Fortal; only components and their variants differ."
  - "HeroUI has no segmented control, so the orders filter and the light/dark choices are primary tabs (RemixTabs) rather than RemixSegmentedControl; they announce as tabs."
  - "HeroUI has no data list or callout: the permission parameters are styled in permission_recipe.yaml and the Settings note is the default alert."
  - "The theme exposes only its selected data, so the radius from Settings reaches both brightnesses through two probe scopes that read the host's light and dark themes."
  - "Headings follow HeroUiTypography's sizes without the typography item, which would add the remix_ui_fonts package to the demo."
