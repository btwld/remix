approximations:
  - The backdrop is the dialog route's barrier: pass `HeroUiTokens.backdrop` as `barrierColor`. Blur (`modal-backdrop-blur-backdrop`, `backdrop-filter`) and the transparent backdrop are not mapped.
  - Alert dialogs use the same recipe inside `showRemixAlertDialog`; HeroUI's drawer has no CSS in the pinned set and is not mapped.
  - The header icon (`modal-md-icon-icon`), the 24 x 24 close trigger (`modal-md-auto-close`), and the scroll modes are the app's composition or RemixDialog's own `scrollable`.
  - The 250ms enter and 100ms exit zoom and slide are the route's transition, not reproduced.
