component: InputGroup
widget: HeroUiInputGroup
target: RemixTextField
status: implemented
source:
  ref: "@heroui/styles@3.2.6"
  pages: [dist/components/input-group.css, dist/components/input.css, dist/utilities/index.css]
anatomy: [group, prefix, input, suffix]
variants: [primary, secondary]
sizes: {supported: [], default: null}
states: [rest, hover, focus, error, disabled]
tokens:
  - the text field's tokens (see textfield.yaml)
  - field-placeholder (prefix and suffix text and icons)
measurements:
  - {what: group, value: "36 high at 1024 px, 40 at 375 px; radius 12", cite: input-group-primary-full-input}
  - {what: minimum height, value: 36, cite: input-group-primary-full-input}
  - {what: group fill and shadow, value: "field-background and surface shadow (primary), default (secondary)", cite: "input-group-primary-full-input, input-group-secondary-full-input"}
  - {what: prefix, value: "12px either side, no padding on the input's side", cite: input-group-primary-full-input-prefix}
  - {what: suffix, value: "12px either side, no padding on the input's side", cite: input-group-primary-full-input-suffix}
  - {what: accessory text, value: "14/20 in the placeholder color", cite: input-group-primary-full-input-prefix}
  - {what: hover fill, value: "field-hover (primary), default-hover (secondary)", cite: "input-group.css .input-group:hover:not(:focus-within), .input-group--secondary hover"}
  - {what: error and focus rings, value: "1px danger outline, 2px when focused, on the whole group", cite: "input-group.css status-invalid-field; input-invalid-focus"}
  - {what: disabled opacity, value: "0.5 on the whole group; no case measures it", cite: "input-group.css [data-disabled] status-disabled"}
approximations:
  - Prefix and suffix are the `leading` and `trailing` widgets; their color reaches text and icons through a default text style and icon theme on the whole field.
  - A prefix or suffix has no border or fill of its own; the default theme's field border is 0px.
  - Remix's text field already focuses on a tap anywhere in its chrome; no group-level tap handling exists.
  - With several lines of text the accessories center vertically; upstream top-aligns them with `pt-2`.
