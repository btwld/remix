  - {what: item, value: "36 high, radius 16, gap 12", cite: "dropdown-default-keyboard-open-menu-item:Apple"}
  - {what: item padding, value: "6px 10px 6px 28px on rows that carry an indicator (ps-7); 10 x 6 on plain rows", cite: "chromium/dropdown_visual.json, default light 1024 keyboard-open, the four rows"}
