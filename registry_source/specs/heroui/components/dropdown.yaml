approximations:
  - Standalone Menu (menu.css) is deferred. It is a different list (`p-1 gap-1`, items `px-2`; measured `menu-default-rest-menu`), and RemixMenu always draws a trigger, so a bare menu has no Remix target.
  - "A `HeroUiButton` is the trigger through `RemixMenuTrigger.control`: it keeps its own look, press scale, and focus ring, and `MenuStyler.trigger` does not apply to it. The recipe's `trigger` style is the bare `.dropdown__trigger` (press scale and focus ring) for label and builder triggers."
  - "Once the list is long enough to scroll, Remix clips it at the scroll view, inside the popover's padding, so the outside row ring loses its sides and the edge rows lose their outer edge."
  - A disabled `HeroUiButton` trigger dims as a button and does not open the menu; `RemixMenu` has no `enabled`, so the bare label trigger has no disabled style.
  - The popover's `max-w-[48svw]` is viewport-relative and is not modeled.
  - The separator spans the menu; HeroUI insets it to 94%.
  - The CSS sets no size for content icons; leading icons are 16px in the label colour (HeroUI's examples use `size-4`), and the trailing submenu chevron is 14px muted (`submenu-indicator svg size-3.5`).
  - A row with a checkbox or radio indicator lays the indicator out in the row. Its label starts at 10 + 10 + 12 = 32px; upstream draws the indicator absolutely and pads the row `ps-7`, so its label starts at 28.
  - The check mark is 10 (`size-2.5`); the radio dot is `size-2` (8) upstream, but the recipe gives checkbox and radio rows the one indicator size.
  - Hover and focus colors ease over the 250ms press curve; the CSS does not transition them.
  - The 150ms popover enter and 100ms exit motion is not reproduced.
