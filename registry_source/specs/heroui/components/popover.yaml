approximations:
  - One 16px inset stands for `.popover` (p-0) plus `.popover__dialog` (p-4); content that wants other padding sets it through `style`.
  - A button trigger needs no shared change. RemixPopover takes any child as its trigger; with `openOnTap: false` and a `MenuController`, the button opens the popover from its own `onPressed`, and Escape and outside taps close it. One `FocusNode` shared as `triggerFocusNode` and the button's `focusNode` keeps the button the only tab stop and returns focus to it on close.
  - The `.popover__heading` weight and the arrow are the app's content; there is no arrow.
  - The 150ms enter and 100ms exit fade, zoom, and slide are not reproduced, and neither is document scroll locking.
  - Placement is Remix's default; HeroUI's offset and collision padding are not in the CSS.
