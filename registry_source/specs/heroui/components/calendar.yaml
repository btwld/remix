apiMapping:
  - "Controlled DateTime or CivilDateRange, onChanged, civil bounds, availability and caller-owned labels retain Remix names and shapes."
  - "Independent navigation, selector, calendar, trigger and panel stylers require hand-written facades; caller overrides merge last. No React props or date state are copied."
approximations:
  - "Single visible Gregorian month only. Remix owns date behavior. Month/year Select menus replace the upstream heading/year-grid composition; nested panels use a 4px gap, trigger-matched width, row-gap-snapped height and persistent scrollbar. Selector item focus is inset to avoid scroll clipping. Segmented editing, time fields, decade/year grids and non-Gregorian calendars remain deferred."
  - "DatePicker and DateRangePicker use a field-shaped button, not the upstream segmented DateField. Remix compacts default range labels to numeric endpoints under bounds and wraps both endpoints instead of truncating one; semantic values remain complete."
  - "The calendar owns the 12px inset; picker popovers have zero extra padding, yielding equal insets. Inline calendars retain that same inset, unlike the unpadded upstream grid."
  - "Day tiles and glyphs scale with text to retain square cells at 200%; upstream's fixed 252px calendar does not. Large calendars can scroll within Remix's bounded viewport."
  - "Today uses the blue accent-soft-foreground numeral and 1px contour; contrast is measured after compositing the soft fill on the surface. Keyboard focus uses a 2px inset foreground contour on every day shape, because the scrolling grid clips an outside ring."
  - "Range endpoints are a single cap rather than an upstream inner circle over a band. Drafts use an outlined soft-accent band; old committed ranges recede to secondary/tertiary surfaces while the live draft owns range roles."
  - "Pressed fills preserve cap and middle roles; whole-day scaling is omitted to keep connected bands. Unavailable dates are struck through. Disabled selection uses a quiet fill and readable text."
  - "Real Geist fonts replace the upstream system sans. Flutter and CSS blur kernels differ; calendar transitions and popover entry/exit are immediate."
  - "Today uses semibold text; its hover uses the ordinary default surface while preserving the contour, rather than upstream soft-accent-hover."
  - "Outside-month cells remain blank: RemixCalendar renders null grid entries as empty boxes and exposes no outside-day painting API. Upstream paints inert muted outside days. Default weekday headings use HeroUI three-letter English labels; callers can localize them."
