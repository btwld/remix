approximations:
  - "The row's trailing inset is a physical right padding, so it does not mirror in right-to-left. Mix cannot merge directional padding with a caller's physical padding, which would make a caller `style` with `padding(.all(..))` throw."
  - The recipe styles `RemixTextField`; the app passes `HeroUiSearchIcon` as `leading` and `HeroUiSearchClearButton` as `trailing`. Without the clear button the right inset is 8, not the input's 12. The recipe exposes a curated parameter set: no `obscureText`, `maxLines`, `minLines`, or `expands`.
  - "`HeroUiSearchClearButton` is the close button recipe at 20 x 20 with a 12px icon, the project icon library's cross, and the label 'Clear search'. It has no state: it does not read the controller, hide itself, or clear the text. Upstream hides it while the field is empty; the app decides, and passes `enabled` for the field and for the button."
  - |
    The app wires the button to its own controller:
      trailing: ListenableBuilder(listenable: controller, builder: (_, _) =>
          controller.text.isEmpty ? const SizedBox.shrink()
          : HeroUiSearchClearButton(onPressed: controller.clear)),
  - The search and clear glyphs are Remix icons (Radix magnifier and cross), not HeroUI's SVGs.
  - While invalid, `search-field.css` hides the description and shows a FieldError; the recipe keeps one `helperText` line that becomes the message.
  - Focus on the clear button does not keep the group's focus ring, which upstream draws on `:focus-within`.
  - The browser's native clear control and autofill highlight do not exist in Flutter.
