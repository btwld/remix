approximations:
  - "The glyph is the project icon library's cross2, not HeroUI's own 16px cross; pass `icon` to replace it."
  - Colours fade over 100ms, the press scale over 250ms with ease-out-quart (theme.css); Mix applies one animation per state, so the scale returns over 100ms.
  - HeroUI's pending state is Remix loading, which shows an sm spinner in the muted colour over the hidden icon.
  - The accessible name defaults to "Close".
