approximations:
  - "The surface card comes from HeroUiAccordionGroup (surface fill, radius 24, antiAlias clip), which wraps RemixAccordionGroup; an item paints no fill or radius. Upstream rounds the first trigger 24 24 0 0 and the last 0 0 24 24 (collapsed); here the card's clip rounds the hover fill instead."
  - "The rule under the last item is not removed (upstream: `accordion-default-last-separator` has no box), and the surface rule is not inset to 3% / 94% (`accordion-surface-closed-separator` is 338.39 of 360 wide); an item cannot know it is last."
  - The indicator is `trailingIcon`; pass a chevron for HeroUI's glyph, otherwise Remix's plus and minus are used.
  - The hover fill animates over the indicator's 250ms; the CSS does not transition it.
  - The panel opens with Remix's 200ms fade and size transition, not ease-out-quad.
  - The focus ring is a 2px inside border in the focus color, without the background gap; AccordionStyler's trigger has no outline effect.
