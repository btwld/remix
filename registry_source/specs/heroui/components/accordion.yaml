  - {what: indicator, value: "size 16, muted, rotated -180 degrees expanded", cite: "accordion-default-closed-indicator, accordion-default-open-indicator"}
  - {what: body, value: "padding 0/16/16, muted, 14", cite: "accordion-default-open-body-inner"}
  - {what: rule, value: "1px under the item, painted over its last pixel; separator, surface-foreground at 6% on surface", cite: "accordion-default-closed-separator, accordion-surface-closed-separator"}
  - {what: hover, value: "foreground at 3%, collapsed items only; default on surface", cite: "accordion-default-hover-trigger, accordion-surface-hover-trigger"}
  - {what: focus ring, value: "2px background gap, then a 2px focus ring", cite: accordion-default-focus-trigger}
