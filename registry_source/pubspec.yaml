name: registry_source
description: >
  The authored source of the bundled Remix registry: the default, Fortal, and
  HeroUI presets, and the Agent behavior the default and Fortal presets style.
  Never published; it exists to be analyzed, tested, and derived into
  `registry/`.
publish_to: none
resolution: workspace

# No `version:` on purpose. Nothing depends on this package and nothing ever
# will: applications consume the installed source the templates derive from.
#
# `lib/src/default` is authored under the word `Vanilla`, `lib/src/fortal`
# under `Fortal`, and `lib/src/heroui` under `HeroUi`; the builder swaps each
# for the consumer's prefix and asserts the round trip on every file.
# `lib/src/agent` is authored under `Agent`, and the default and Fortal recipes
# import it by relative path.

# The workspace floor rather than the consumer floor: the default preset's
# `sidebar_layout` uses private named parameters, a Dart 3.12 feature, and
# installs that requirement into every consumer already.
environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # The workspace resolves this to the sibling source package. The derived
  # registry owns the hosted Remix floor installed into consumer applications.
  remix: ^1.0.0-beta.13
  mix: ^2.3.1
  mix_annotations: ^2.2.0-beta.1
  mix_chart: ^0.0.1-beta.3
  remix_ui_icons: ^0.1.0
  remix_ui_fonts: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.1
  # Pins the HeroUI reference snapshot by sha256 (tool/heroui_parity/check.dart).
  crypto: ^3.0.7
  mix_generator: ^2.2.0-beta.3
