name: remix_vanilla
description: The authored source of the default Remix registry preset.
publish_to: none
resolution: workspace

# No `version:` on purpose. This package is never published: it is the
# analyzer-checked source `tool/build_registry.dart` derives the bundled
# default preset from. Applications consume that installed source only.
#
# `Vanilla` is the authoring word the derivation swaps for the consumer's
# prefix. It appears nowhere else in this source, which the builder asserts
# through a round trip on every file.

# The workspace floor rather than the consumer floor: `sidebar_layout` uses
# private named parameters, a Dart 3.12 feature, and installs that
# requirement into every consumer already.
environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # The workspace resolves this to the sibling source package. The derived
  # registry owns the hosted Remix floor installed into consumer applications.
  remix: ^1.0.0-beta.10
  mix: ^2.2.0-beta.5
  mix_annotations: ^2.2.0-beta.1
  mix_chart: ^0.0.1-beta.1
  remix_ui_icons: ^0.1.0
  # Recipes style Agent behavior. The workspace resolves this to the sibling
  # source package; installed recipes import the same behavior as installed
  # source, so the constraint carries no version.
  remix_agent: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.1
  mix_generator: ^2.2.0-beta.3
