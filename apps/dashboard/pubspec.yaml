name: dashboard
description: Workspace-only Fortal dashboard example showcasing Remix theming and components.
publish_to: "none"
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # Workspace resolution uses the local packages during development; these
  # hosted constraints keep the app manifest deployable outside the workspace.
  mix_annotations: ^2.2.0-beta.1
  mix_chart: ^0.0.1-beta.1
  remix: ^1.0.0-beta.10
  remix_fortal: ^1.0.0-beta.9
  remix_ui_icons: ^0.1.0

dev_dependencies:
  build_runner: ^2.10.1
  flutter_test:
    sdk: flutter
  mix_generator: ^2.2.0-beta.3

flutter:
  uses-material-design: true
