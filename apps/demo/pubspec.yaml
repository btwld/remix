name: demo
description: Widgetbook catalog for reviewing Remix and Fortal components.
publish_to: "none"
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependency_overrides:
  accessibility_tools: ^2.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  widgetbook_annotation: ^3.11.0
  widgetbook: ^3.25.0
  # Workspace resolution uses the local packages during development; these
  # hosted constraints keep the app manifest deployable outside the workspace.
  remix: ^1.0.0-beta.10
  remix_ui_icons: ^0.1.0
  mix_annotations: ^2.2.0-beta.1
  mix_chart: ^0.0.1-beta.3

dev_dependencies:
  build_runner: ^2.10.1
  flutter_test:
    sdk: flutter
  mix_generator: ^2.2.0-beta.3
  widgetbook_generator: ^3.24.0

flutter:
  uses-material-design: true
