name: Validate Angular pilot
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Public release gate: replace action tags with independently verified full SHAs.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-lock.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: sudo apt-get update && sudo apt-get install -y libcairo2
      - run: python -m pip install -r requirements-dev.txt
      # Check committed outputs first; do not overwrite a stale export silently.
      - run: python tools/run_checks.py
      - run: git diff --exit-code -- generated docs/catalog packages/web generated-sha256.json
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: asset-validation
          path: reports/
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python tests/integration/browser_checks.py --mode full --browser ${{ matrix.browser }}
      - run: python tests/integration/audit_browser_checks.py --mode full --browser ${{ matrix.browser }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: |
            reports/
            review/
