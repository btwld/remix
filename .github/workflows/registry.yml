name: Promote registry

on:
  push:
    branches: [main]
  workflow_dispatch:

# Per ref, so a dispatch from another branch cannot replace a queued `main`
# run. Only `main` promotes, so runs on other refs never race the branch.
concurrency:
  group: registry-promote-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true
      - run: flutter pub get
      - name: Validate generated output and dependency floors
        run: |
          dart run tool/build_registry.dart --check
          dart run tool/check_dependency_constraints.dart
          dart run tool/check_version_alignment.dart
          dart test test/tool/build_registry_test.dart test/tool/build_registry_agent_test.dart
      - name: Test CLI and frozen compatibility snapshot
        working-directory: packages/remix_cli
        run: dart test
      - name: Install both committed presets with hosted dependencies
        run: dart run melos run open-code:release:check
      # A dispatch from another branch must not treat that commit as the
      # promotion candidate. The smoke reads the commit directly so a failure
      # stops the push below.
      - name: Smoke-test this commit with the same CLI
        if: github.ref == 'refs/heads/main'
        env:
          REMIX_REGISTRY_RELEASE_REF: ${{ github.sha }}
        run: |
          dart run tool/check_open_code.dart --source hosted
          dart run tool/check_open_code.dart --preset fortal --source hosted

  promote:
    name: Promote registry
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote registry-stable
        run: git push origin HEAD:refs/heads/registry-stable
