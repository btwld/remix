name: Tag releases

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      packages:
        description: 'Comma-separated package names (e.g. remix,remix_cli)'
        type: string
        required: true

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - name: Create tags and dispatch publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BEFORE: ${{ github.event.before }}
          RELEASE_PACKAGES: ${{ inputs.packages }}
        run: dart run tool/release_packages.dart tag
