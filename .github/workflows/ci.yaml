name: CI

# The verification work is defined by the `ci` script in the root pubspec, and
# each of its steps runs below as its own job. They are independent, so running
# them in parallel costs the slowest job rather than their sum -- which is what
# took this pipeline from ~20 minutes to roughly the length of `open-code`.
#
# Jobs are sized by cost, not by theme: `checks` bundles the contract checkers
# that together take seconds, while each open-code preset gets a job of its own
# because installing every registry item takes 15 to 25 minutes, far longer
# than anything else here.
#
# The workflow restates the `ci` steps instead of deriving them, which is the
# one hazard of this layout: a step added to `ci` but not wired in here would
# never run, and would look green because nothing reports a job that does not
# exist. tool/check_ci_coverage.dart fails on that drift and runs inside the
# `checks` job.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - uses: invertase/github-action-dart-analyzer@v1
        with:
          fatal-infos: false
      - run: dart run melos run ci:checks

  codegen:
    name: Generated source drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - run: dart run melos run ci:codegen

  flutter-tests:
    name: Flutter package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - run: dart run melos run ci:flutter
      - name: Upload golden failure images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: apps/**/test/failures/*.png
          if-no-files-found: ignore
          retention-days: 7

  cli-tests:
    name: CLI tests and consumer mirrors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - run: dart run melos run ci:cli

  # Each preset installs every registry item into a throwaway consumer app, and
  # none reads another's output. Sequentially they dominated the old run; as a
  # matrix they cost the slowest preset. `fail-fast: false` so a break in one
  # preset still reports the others rather than masking them.
  open-code:
    name: Open-code consumers (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [vanilla, fortal, heroui]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - run: dart run melos run ci:open-code:${{ matrix.preset }}

  open-code-icons:
    name: Open-code Lucide icons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - run: dart run melos run ci:open-code:icons

  cli-windows:
    name: Verify the CLI with the Windows Flutter SDK
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true
      - name: Resolve the standalone CLI package
        working-directory: packages/remix_cli
        run: |
          Set-Content -Path pubspec_overrides.yaml -Value 'resolution:'
          dart pub get
      - name: Verify real SDK execution and source preservation
        working-directory: packages/remix_cli
        run: dart test test/installer_sdk_test.dart

  # The icon font and its Dart API are generated from tool/icons/manifest.yaml
  # and the Vector UI masters in design/icons. The job keeps the id `icons`,
  # and so the check name it has always reported.
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Flutter renders every glyph in the last step.
      - uses: ./.github/actions/setup-workspace
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.24"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: packages/remix_ui_icons/tool/icons/uv.lock
      - name: Test the icon generator
        run: uv run --frozen --project packages/remix_ui_icons/tool/icons python -m unittest discover -s packages/remix_ui_icons/tool/icons -p 'test_*.py'
      - name: Regenerate the icon artifacts and fail on drift
        run: |
          uv run --frozen --project packages/remix_ui_icons/tool/icons python packages/remix_ui_icons/tool/icons/generate.py
          git diff --exit-code -- packages/remix_ui_icons
      # The lock is append-only, which a single checkout cannot show: compare
      # it with the lock this change starts from.
      - name: Fetch the codepoint lock this change starts from
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.base_ref || github.event.before }}
        run: |
          lock=packages/remix_ui_icons/tool/icons/codepoints.lock.json
          if git fetch --depth=1 origin "$BASE" && git show "FETCH_HEAD:$lock" > "$RUNNER_TEMP/base-lock.json"; then
            echo "REMIX_ICONS_BASE_LOCK=$RUNNER_TEMP/base-lock.json" >> "$GITHUB_ENV"
          else
            echo "$BASE has no codepoint lock yet; checking this one alone."
          fi
      - name: Verify the lock, generated Dart, glyph rasters, API, and Flutter rendering
        run: |
          args=(--flutter flutter)
          if [ -n "${REMIX_ICONS_BASE_LOCK:-}" ]; then args+=(--base-lock "$REMIX_ICONS_BASE_LOCK"); fi
          uv run --frozen --project packages/remix_ui_icons/tool/icons python packages/remix_ui_icons/tool/icons/check.py "${args[@]}"

  # A release build must keep only the glyphs an app refers to, on the oldest
  # Flutter the package supports and on current stable. The tree shaker
  # changes between releases (ConstFinder today, record_use on master).
  icons-tree-shake:
    name: Icon tree shaking (Flutter ${{ matrix.flutter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.41.0', stable]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter != 'stable' && matrix.flutter || '' }}
          channel: stable
          cache: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.24"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: packages/remix_ui_icons/tool/icons/uv.lock
      - name: Build a release web app and inspect the shipped font
        run: uv run --frozen --project packages/remix_ui_icons/tool/icons python packages/remix_ui_icons/tool/icons/tree_shake.py --flutter flutter
