name: CI

# The verification work is defined by the `ci` script in the root pubspec, and
# each of its steps runs below as its own job. They are independent, so running
# them in parallel costs the slowest job rather than their sum -- which is what
# took this pipeline from ~20 minutes to roughly the length of `open-code`.
#
# Jobs are sized by cost, not by theme: `checks` bundles nine contract checkers
# that together take seconds, while the two open-code presets get a job each
# purely because they are ~5 minutes apiece and were half the old wall clock.
#
# The workflow restates the `ci` steps instead of deriving them, which is the
# one hazard of this layout: a step added to `ci` but not wired in here would
# never run, and would look green because nothing reports a job that does not
# exist. tool/check_ci_coverage.dart fails on that drift and runs inside the
# `checks` job.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - uses: invertase/github-action-dart-analyzer@v1
        with:
          fatal-infos: false
      - run: dart run melos run ci:checks

  codegen:
    name: Generated source drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - run: dart run melos run ci:codegen

  flutter-tests:
    name: Flutter package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - run: dart run melos run ci:flutter

  cli-tests:
    name: CLI tests and dogfood mirror
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - run: dart run melos run ci:cli

  # Both presets install every registry item into a throwaway consumer app, and
  # neither reads the other's output. Sequentially they were ~10 of the old ~20
  # minutes; as a matrix they cost one preset. `fail-fast: false` so a break in
  # one preset still reports the other rather than masking it.
  open-code:
    name: Open-code consumers (${{ matrix.preset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [vanilla, fortal]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-workspace
      - run: dart run melos run ci:open-code:${{ matrix.preset }}

  cli-windows:
    name: Verify the CLI with the Windows Flutter SDK
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true
      - name: Resolve the standalone CLI package
        working-directory: packages/remix_cli
        run: |
          Set-Content -Path pubspec_overrides.yaml -Value 'resolution:'
          dart pub get
      - name: Verify real SDK execution and source preservation
        working-directory: packages/remix_cli
        run: dart test test/installer_sdk_test.dart

  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.24"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: packages/remix_ui_icons/tool/radix_icons/uv.lock
      - name: Verify generated Remix icons
        run: uv run --frozen --project packages/remix_ui_icons/tool/radix_icons glyphpact --config packages/remix_ui_icons/tool/radix_icons/glyphpact.json --check
      - name: Test Remix icon index generator
        run: uv run --frozen --project packages/remix_ui_icons/tool/radix_icons python -m unittest discover -s packages/remix_ui_icons/tool/radix_icons -p 'test_*.py'
      - name: Verify icon integrity contract
        run: uv run --frozen --project packages/remix_ui_icons/tool/radix_icons python packages/remix_ui_icons/tool/radix_icons/verify.py
