name: Prepare Version Bump

# Pushes a branch that sets Remix to one explicit version and links its changelog
# to the upcoming GitHub Release. The summary drafts notes from conventional
# commits. registry_source is private and deliberately outside this workflow.
#
# It pushes a branch and prints its compare link rather than opening the pull
# request itself. Opening one from a workflow needs "Allow GitHub Actions to
# create and approve pull requests", which is off by default and also grants
# approval rights, so the one click is cheaper than the permission.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version for remix (e.g. 1.0.0-beta.9)."
        required: true

permissions:
  contents: write

jobs:
  version:
    timeout-minutes: 15
    name: Bump Remix version and changelog
    runs-on: ubuntu-latest
    env:
      REMIX_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # melos derives Remix's last release from its `remix-v*` tag, so the
          # full history and all tags must be present. A shallow
          # clone makes it walk every commit and rewrite the whole changelog.
          fetch-depth: 0

      - uses: kuhnroyal/flutter-fvm-config-action@v2
        id: fvm-config-action

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Bump versions
        id: bump
        run: |
          set -euo pipefail

          version="$REMIX_VERSION"

          # No `dart pub global activate melos`. melos runs whichever version
          # the workspace pins as a dev dependency, so a global install cannot
          # decide the version and only prints a reassuring, wrong one into the
          # log — which is how a 7.8.2 crash came to be reported under an
          # "Activated melos 8.5.0" line. Resolving the workspace and running
          # its own melos makes the pin the single source of truth.
          dart pub get
          dart run melos bootstrap

          # Versioning happens on the checked-out branch, and the release
          # branch is cut afterwards from the modified tree. `melos version`
          # opens with `git pull --tags -f` to refresh the `<package>-v*` tags
          # it derives each last release from, and a branch made here with
          # `git checkout -b` has no upstream, so that pull aborts with "there
          # is no tracking information for the current branch" before melos
          # writes anything. Running while the tracking branch actions/checkout
          # set up is still current is what gives that pull a remote to read.

          # `--no-git-commit-version` is what makes the diff check below
          # meaningful. melos commits by default, which would leave a clean tree
          # and make a successful run look like "nothing to version". It also
          # implies --no-git-tag-version.
          # `--yes` is what skips the changelog-entry prompt manual `-V`
          # versioning would otherwise raise. That is true from melos 8.0.0,
          # which put the flag in front of it; on 7.x the prompt was
          # unconditional and this workflow crashed on it. `< /dev/null` is
          # kept as a second line of defence for any prompt added later, but it
          # is not what makes this work: melos re-executes itself and the
          # child does not inherit the redirect, so a redirected stdin alone
          # still reached the prompt and threw StdinException.
          # `-V` requests the exact version, but melos can still skip Remix
          # if an excluded dependency has pending changes. Scope is explicit
          # so independently versioned remix_cli cannot enter the release branch.
          # Disable dependent constraint and version propagation too: melos
          # otherwise rewrites and can version workspace dependents even when
          # the initial package filter selects only Remix, which would pull the
          # unpublished registry_source authoring package back into releases.
          dart run melos version \
            --scope=remix \
            --no-dependent-constraints \
            --no-dependent-versions \
            --no-git-commit-version \
            --yes \
            -V "remix:$version" < /dev/null

          dart run tool/check_version_alignment.dart --expect-remix "$version"

          if ! git diff --quiet HEAD -- packages/remix/pubspec.yaml; then
            dart run tool/release_packages.dart link-changelog remix > "$RUNNER_TEMP/remix-release-notes.md"
          fi

          # The remote registry.yaml is data, not a pubspec, so melos never
          # reaches it and its `remix: ^<floor>` would keep pointing at the
          # previous release.
          # That floor is what the CLI reports as the tested version, so this
          # step is part of versioning, not a cleanup after it.
          dart run tool/sync_registry_remix.dart

          # Docs pin the version being released; docs:check fails on a stale pin.
          dart run tool/sync_install_pins.dart

          # The Fortal preset copies its dependency floors from the default
          # registry. Rebuild it immediately after the default floor moves so
          # the two committed registry trees cannot disagree.
          dart run tool/build_registry.dart

          # Verify the released Remix version and registry floor agree. This
          # also fails when the sync step above did not run.
          dart run tool/check_version_alignment.dart

          if git diff --quiet && git diff --cached --quiet; then
            echo "Remix is already at $version; no release branch was created."
            echo "versioned=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "versioned=true" >> "$GITHUB_OUTPUT"

          # Cut the branch now, carrying the working tree melos just wrote.
          git checkout -b release/version-packages

          git add -A
          git commit -m "chore(release): version Remix"
          git push --set-upstream origin release/version-packages --force

      - name: Summarise
        if: steps.bump.outputs.versioned == 'true'
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/compare/main...release/version-packages?expand=1"
          {
            echo "### Remix version bumped"
            echo
            echo "[Open the pull request]($url)"
            echo
            echo "Remix is on \`$REMIX_VERSION\`."
            echo
            echo '1. Review and merge the version-bump PR to `main`.'
            printf '2. Draft a GitHub Release with a new `v%s` tag targeting the reviewed commit on `main`.\n' "$REMIX_VERSION"
            echo '3. Write the notes in the Release, tick **Set as a pre-release** if needed, and publish it.'
            echo '4. The tag push starts **Publish to pub.dev**. Approve the environment gate if prompted.'
            printf '5. After pub.dev publishing succeeds, CI adds the `remix-v%s` Melos alias.\n' "$REMIX_VERSION"
            echo
            echo 'If publishing fails, fix the cause and re-run the failed jobs. Never move the tag.'
            echo 'See `open_code/RELEASING.md` for recovery. Never `git push --tags`.'
            if [[ -s "$RUNNER_TEMP/remix-release-notes.md" ]]; then
              echo
              echo '### Draft GitHub Release notes'
              echo
              cat "$RUNNER_TEMP/remix-release-notes.md"
            fi
            echo
            echo "### CI on this branch"
            echo
            echo 'CI installs every preset against checkout Remix.'
            echo 'Merging starts **Promote registry**. If this Remix version'
            echo 'is not on pub.dev yet, that run fails and `registry-stable`'
            echo 'does not move. After pub.dev serves the new version, run'
            echo '`dart run melos run open-code:release:check`, then re-run'
            echo '**Promote registry** on `main` (Actions → Promote registry'
            echo '→ Run workflow). Do not force-push `registry-stable`.'
            echo 'The CLI publish workflow requires that branch to resolve.'
            echo 'Do not lower the registry floor to bypass a missing release.'
            echo
            echo "### remix_cli"
            echo
            echo '`remix_cli` is versioned independently and is NOT in this'
            echo 'release. To release it, in its own pull request: bump'
            echo '`packages/remix_cli/pubspec.yaml`,'
            echo '`packages/remix_cli/lib/src/version.dart`, and its CHANGELOG'
            echo 'to the same version. Run `dart run tool/release_packages.dart link-changelog remix_cli`'
            echo 'and `dart run tool/sync_install_pins.dart`. After merging, publish a GitHub Release'
            echo 'from the new `remix_cli-v<version>` tag on `main`.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Open the pull request: $url"
