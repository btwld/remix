name: One-time Angular icon import

# Temporary transfer helper. Removed after the verified import completes.
# It cannot run for main, tags, pull requests, or another repository.
on:
  push:
    branches: ['feat/angular-icon-family-pilot']
    paths: ['.icon-import/READY']

permissions:
  contents: read

concurrency:
  group: one-time-angular-icon-import
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'btwld/remix' && github.ref == 'refs/heads/feat/angular-icon-family-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Verify and extract the approved archive
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, io, json, tarfile

          staging = Path('.icon-import')
          target = Path('design/icons/angular')
          expected = 'ce26af07b117fa49f1980dbe73f2308d20f769d479bdaf26487bdab4c1c0e02b'
          parts = [staging / f'chunk-{i:02d}' for i in range(39)]
          assert all(p.is_file() for p in parts), 'Missing archive chunk'
          archive = b''.join(p.read_bytes() for p in parts)
          assert len(archive) == 231168, 'Unexpected archive length'
          assert hashlib.sha256(archive).hexdigest() == expected, 'Archive checksum mismatch'
          assert not target.exists(), 'Refusing to overwrite an existing icon package'
          target.mkdir(parents=True)
          with tarfile.open(fileobj=io.BytesIO(archive), mode='r:xz') as tf:
              members = tf.getmembers()
              assert len(members) == 741, 'Unexpected archive file count'
              names = set()
              for member in members:
                  rel = PurePosixPath(member.name)
                  assert member.isfile(), 'Only regular files may be imported'
                  assert not rel.is_absolute() and '..' not in rel.parts, 'Unsafe path'
                  assert member.name not in names, 'Duplicate archive member'
                  assert member.size < 3000000, 'Unexpected member size'
                  names.add(member.name)
                  destination = target.joinpath(*rel.parts)
                  assert destination.resolve().is_relative_to(target.resolve())
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  data = tf.extractfile(member).read()
                  assert len(data) == member.size
                  destination.write_bytes(data)
                  destination.chmod(0o644)
          manifest = (target / 'FILE-MANIFEST.sha256').read_text().splitlines()
          assert len(manifest) == 740
          for line in manifest:
              digest, name = line.split('  ', 1)
              path = target / name
              assert path.resolve().is_relative_to(target.resolve())
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, name
          products = json.loads((target / 'generated-sha256.json').read_text())
          assert len(products) == 357
          for name, digest in products.items():
              assert hashlib.sha256((target / name).read_bytes()).hexdigest() == digest, name
          assert len(list((target / 'generated/angular').rglob('*.svg'))) == 288
          print('Verified 741 imported files, 288 SVGs, and all 357 original generated products.')
          print('This is transfer verification, not a new design, browser, or release approval.')
          PY
      - name: Commit only the imported package to the review branch
        shell: bash
        run: |
          git add --force -- design/icons/angular
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          paths = [p for p in paths if p]
          assert len(paths) == 741
          assert all(p.startswith('design/icons/angular/') for p in paths)
          PY
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(icons): import audited Angular family pilot.2'
          git push origin HEAD:refs/heads/feat/angular-icon-family-pilot
