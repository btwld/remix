name: Deploy documentation and showcases

on:
  push:
    branches: ["main"]
  pull_request:
    # Exactly these types. ready_for_review re-runs this workflow after a draft
    # is marked ready. Do not add edited, labeled, unlabeled, or assigned.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages.
# pull-requests: read is for the job-level path filter.
permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

# Allow only one concurrent Pages run per branch or pull request
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      # Exactly one of these steps runs. `||` keeps the value that step wrote.
      code: ${{ steps.on-push.outputs.code || steps.on-ready.outputs.code }}
      docs: ${{ steps.on-push.outputs.docs || steps.on-ready.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        with:
          predicate-quantifier: some-with-excludes
          filters: .github/path-filters.yml
          token: ${{ github.token }}
      - id: on-push
        if: github.event_name != 'pull_request'
        run: |
          echo "code=true" >> "$GITHUB_OUTPUT"
          echo "docs=true" >> "$GITHUB_OUTPUT"
      - id: on-ready
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        env:
          CODE_CHANGED: ${{ steps.filter.outputs.code }}
          DOCS_CHANGED: ${{ steps.filter.outputs.docs }}
        run: |
          set -euo pipefail
          case "$CODE_CHANGED" in
            true|false) ;;
            *) echo "Unexpected code filter result: $CODE_CHANGED" >&2; exit 1 ;;
          esac
          case "$DOCS_CHANGED" in
            true|false) ;;
            *) echo "Unexpected docs filter result: $DOCS_CHANGED" >&2; exit 1 ;;
          esac
          echo "code=$CODE_CHANGED" >> "$GITHUB_OUTPUT"
          echo "docs=$DOCS_CHANGED" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    # Run on a draft so this check fails instead of skipping. A skip would
    # satisfy branch protection before ready_for_review builds the site.
    # Non-code, non-site pull requests skip the build; pushes to main always build.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == true ||
      needs.changes.outputs.code == 'true' ||
      needs.changes.outputs.docs == 'true'
    timeout-minutes: 30
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true && 'ubuntu-slim' || 'ubuntu-latest' }}
    env:
      NEXT_PUBLIC_BASE_PATH: /remix
      NEXT_PUBLIC_SITE_URL: https://btwld.github.io
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Fail draft pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == true
        run: |
          echo "::error::Draft pull request. Mark it ready for review to build the docs site."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Resolve the workspace and run its own melos rather than installing one
      # globally: melos delegates to the version pinned in the root pubspec, so
      # a global install cannot decide the version.
      - name: Bootstrap workspace
        run: |
          dart pub get
          dart run melos bootstrap

      - uses: ./.github/actions/setup-docs

      - name: Validate documentation
        run: dart run melos run docs:check

      - name: Type check documentation
        run: pnpm --dir apps/docs typecheck

      - name: Build documentation and component catalog
        working-directory: apps/docs
        run: pnpm build

      - name: Build dashboard
        working-directory: apps/dashboard
        run: flutter build web --release --base-href /remix/dashboard/

      - name: Assemble Pages site
        run: |
          node apps/docs/scripts/package-pages.mjs

      - name: Check exported routes and assets
        run: |
          node apps/docs/scripts/test-pages.mjs
          node --test apps/docs/scripts/test-static-http.mjs

      - name: Verify static search
        working-directory: apps/docs
        run: pnpm test:search

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages

  deploy:
    timeout-minutes: 10
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Pages deploy is one action. The site build stays on ubuntu-latest.
    runs-on: ubuntu-slim
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
