name: Deploy documentation and showcases

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent Pages run per branch or pull request
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /remix
      NEXT_PUBLIC_SITE_URL: https://conceptadev.github.io
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Resolve the workspace and run its own melos rather than installing one
      # globally: melos delegates to the version pinned in the root pubspec, so
      # a global install cannot decide the version.
      - name: Bootstrap workspace
        run: |
          dart pub get
          dart run melos bootstrap

      - uses: ./.github/actions/setup-docs

      - name: Validate documentation
        run: |
          dart run tool/generate_fortal_catalog.dart --check
          python3 tool/check_tutorial_assets.py
          python3 -m unittest discover -s tool -p 'test_tutorial_assets.py'
          pnpm --dir apps/docs typecheck

      - name: Build documentation and component catalog
        working-directory: apps/docs
        run: pnpm build

      - name: Build dashboard
        working-directory: apps/dashboard
        run: flutter build web --release --base-href /remix/dashboard/

      - name: Assemble Pages site
        run: |
          node apps/docs/scripts/package-pages.mjs

      - name: Check exported routes and assets
        run: |
          node apps/docs/scripts/test-pages.mjs
          node --test apps/docs/scripts/test-static-http.mjs

      - name: Verify static search
        working-directory: apps/docs
        run: pnpm test:search

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
