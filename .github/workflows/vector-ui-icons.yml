name: Vector UI icons
on:
  pull_request:
    paths:
      - design/icons/**
      - .github/workflows/vector-ui-icons.yml
  push:
    branches: [main]
    paths:
      - design/icons/**
      - .github/workflows/vector-ui-icons.yml
permissions:
  contents: read
concurrency:
  group: vector-ui-icons-${{ github.ref }}
  cancel-in-progress: true
env:
  VECTOR_UI_EVIDENCE_DIR: ${{ github.workspace }}/.context/vector-ui-evidence
jobs:
  assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: design/icons
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: python -m pip install -r requirements.txt -r angular/requirements-dev.txt
      - run: python -m playwright install --with-deps firefox
      - run: python tools/run_checks.py
      - run: python build.py
      - run: git diff --exit-code -- .
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: vector-ui-assets
          path: ${{ env.VECTOR_UI_EVIDENCE_DIR }}
  browsers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: design/icons/angular
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python tests/integration/browser_checks.py --mode full --browser ${{ matrix.browser }}
      - run: python tests/integration/audit_browser_checks.py --mode full --browser ${{ matrix.browser }}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: vector-ui-browser-${{ matrix.browser }}
          path: ${{ env.VECTOR_UI_EVIDENCE_DIR }}
