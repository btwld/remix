name: Vector UI icons
on:
  pull_request:
    # Exactly these types. ready_for_review re-runs icon checks after a draft
    # is marked ready. Paths stay on the workflow: these jobs are not required
    # checks on every pull request, and a required check that never starts
    # would stay pending. Job-level draft skips are below.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - design/icons/**
      - .github/workflows/vector-ui-icons.yml
  push:
    branches: [main]
    paths:
      - design/icons/**
      - .github/workflows/vector-ui-icons.yml
permissions:
  contents: read
concurrency:
  group: vector-ui-icons-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  VECTOR_UI_EVIDENCE_DIR: ${{ github.workspace }}/.context/vector-ui-evidence
jobs:
  draft:
    name: Draft gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Fail draft pull requests
        if: github.event.pull_request.draft == true
        run: |
          echo "::error::Draft pull request. Mark it ready for review to run icon checks."
          exit 1
      - name: Ready for review
        if: github.event.pull_request.draft != true
        run: echo "Pull request is ready for review."
  assets:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: design/icons
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: python -m pip install -r requirements.txt -r outline/requirements-dev.txt
      - run: python -m playwright install --with-deps firefox
      - run: python tools/run_checks.py
      - run: python build.py
      - run: git diff --exit-code -- .
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: vector-ui-assets
          path: ${{ env.VECTOR_UI_EVIDENCE_DIR }}
  browsers:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: design/icons/outline
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python tests/integration/browser_checks.py --mode full --browser ${{ matrix.browser }}
      - run: python tests/integration/audit_browser_checks.py --mode full --browser ${{ matrix.browser }}
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: vector-ui-browser-${{ matrix.browser }}
          path: ${{ env.VECTOR_UI_EVIDENCE_DIR }}
