name: Publish to pub.dev

# Four tag-gated jobs keep each package aligned with its configured pub.dev
# automated-publishing tag pattern.
#
# THE FOUR PACKAGES PUBLISH FROM DIFFERENT TAG PATTERNS. This is not a style
# choice — it is each package's "Automated publishing" tag pattern on pub.dev,
# and the OIDC token is rejected if the pushed tag does not match:
#
#   remix          ->  v<version>               (bare, e.g. v1.0.0-beta.5)
#   remix_ui_icons ->  remix_ui_icons-v<version>
#   remix_cli      ->  remix_cli-v<version>
#   naked_ui       ->  naked_ui-v<version>
#
# naked_ui released from its own repository on the BARE `v<version>` pattern.
# That pattern belongs to remix here, so naked_ui moves to the prefixed form
# above. Its pub.dev "Automated publishing" tag pattern must be changed to
# `naked_ui-v{{version}}` before the first release from this monorepo; until
# that is done the job below authenticates against the old pattern and fails.
#
# Pushing `remix-v<version>` therefore does NOT publish remix. It fails
# authentication with "this token has 'refs/tags/remix-v...' ref for which
# publishing is not allowed. Expected tag 'v...'". That prefix is deliberately
# absent from the triggers below so the mistake cannot start a doomed run.
# Aligning the two would mean changing remix's tag pattern on pub.dev first.
#
# Separately, `melos version` derives each package's last release from its
# `<package>-v*` tag. So a remix release wants both tags: `v<version>` is what
# publishes, `remix-v<version>` is what melos reads. Only the first triggers
# this workflow.
#
# remix_cli, remix_ui_icons, and naked_ui are versioned independently from
# Remix.
# The CLI release requires a published stable registry release and its hosted
# runtime dependencies. registry_source/ is private authoring source; registry/
# is published independently through registry-v* GitHub releases.
on:
  push:
    tags:
      - 'remix_cli-v[0-9]+.[0-9]+.[0-9]+*'
      - 'remix_ui_icons-v[0-9]+.[0-9]+.[0-9]+*'
      - 'naked_ui-v[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'

# Match the SDK used by version preparation and local validation. Floating to
# latest stable can fail before package resolution even when the release passed CI.
jobs:
  verify-cli-consumers:
    if: startsWith(github.ref, 'refs/tags/remix_cli-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          cache: true
      - name: Resolve the workspace
        run: flutter pub get
      - name: Verify both presets from the published registry with hosted Remix
        env:
          REMIX_REGISTRY_RELEASE_SMOKE: '1'
        run: dart run melos run open-code:release:check

  publish-remix:
    # Bare `v*` only; package-prefixed tags do not start with `refs/tags/v`.
    if: startsWith(github.ref, 'refs/tags/v')
    uses: conceptadev/dart-actions/.github/workflows/publish.yml@9bb0b129ef4984963f9df9e03733eb2851e413ad
    with:
      packages_folder_path: "packages"
      packages: "remix"
      flutter_version_file: ".fvmrc"
    permissions:
      id-token: write
      contents: read

  publish-remix-ui-icons:
    if: startsWith(github.ref, 'refs/tags/remix_ui_icons-v')
    uses: conceptadev/dart-actions/.github/workflows/publish.yml@9bb0b129ef4984963f9df9e03733eb2851e413ad
    with:
      packages_folder_path: "packages"
      packages: "remix_ui_icons"
      flutter_version_file: ".fvmrc"
    permissions:
      id-token: write
      contents: read

  publish-remix-cli:
    if: startsWith(github.ref, 'refs/tags/remix_cli-v')
    needs: verify-cli-consumers
    uses: conceptadev/dart-actions/.github/workflows/publish.yml@9bb0b129ef4984963f9df9e03733eb2851e413ad
    with:
      packages_folder_path: "packages"
      packages: "remix_cli"
      flutter_version_file: ".fvmrc"
    permissions:
      id-token: write
      contents: read

  publish-naked-ui:
    if: startsWith(github.ref, 'refs/tags/naked_ui-v')
    uses: conceptadev/dart-actions/.github/workflows/publish.yml@9bb0b129ef4984963f9df9e03733eb2851e413ad
    with:
      packages_folder_path: "packages"
      packages: "naked_ui"
      flutter_version_file: ".fvmrc"
    permissions:
      id-token: write
      contents: read
