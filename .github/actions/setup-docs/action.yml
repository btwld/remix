name: Set up Concepta docs
description: Install the pinned docs toolchain and dependencies
inputs:
  working-directory:
    description: Directory containing the docs package and lockfile
    default: apps/docs
runs:
  using: composite
  steps:
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '24.14.0'
    - shell: bash
      run: npm install --global pnpm@11.5.3
    - name: Install locked dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile
