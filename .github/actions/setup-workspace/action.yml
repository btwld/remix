name: Set up the Remix workspace
description: >-
  Install the pinned Flutter SDK and resolve the pub workspace, with both caches
  warm. Shared by every CI job so the split pipeline pays setup once per job
  instead of re-deriving it in five places.

runs:
  using: composite
  steps:
    # The Flutter version comes from .fvmrc so this action and the local
    # toolchain cannot disagree. Hardcoding it here would make .fvmrc advisory.
    - uses: kuhnroyal/flutter-fvm-config-action@v2
      id: fvm-config-action

    - uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
        channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}
        cache: true

    # Caching the SDK alone leaves the slowest downloads uncached. The
    # open-code checks build throwaway consumer apps that resolve from pub.dev
    # on every run, and those downloads are why a cold pipeline ran ~30 minutes
    # against a warm one's ~20.
    #
    # The key covers both resolutions the cache actually serves. `pubspec.lock`
    # is this workspace's; the registry manifests are where the throwaway apps'
    # dependencies come from, and keying on the workspace lockfile alone left
    # every registry-only change re-downloading against a partial restore. Any
    # change to either invalidates the key, so a stale cache still cannot hide
    # a real resolution failure.
    - uses: actions/cache@v4
      with:
        path: ~/.pub-cache
        key: >-
          pub-${{ runner.os }}-${{ hashFiles('pubspec.lock',
          'packages/remix_cli/lib/src/registry/*/registry.yaml') }}
        restore-keys: pub-${{ runner.os }}-

    # `melos` is a dev_dependency, so resolving the workspace is also what puts
    # it on `dart run`. Deliberately not `dart pub global activate melos`: a
    # global install cannot honour the version the workspace pins, and only
    # prints a reassuring, wrong one into the log.
    - name: Resolve the workspace
      shell: bash
      run: flutter pub get
