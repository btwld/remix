name: remix_workspace
environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dev_dependencies:
  melos: ^7.1.1
  flutter_lints: ^6.0.0
  build_runner: ^2.10.1
  pub_semver: ^2.2.0
  yaml: ^3.1.3

workspace:
  - packages/dashboard
  - packages/demo
  - packages/example
  - packages/playground
  - packages/remix
  - packages/remix_chart

melos:
  packages:
    - packages/*

  command:
    bootstrap:
      environment:
        sdk: ">=3.12.0 <4.0.0"
        flutter: ">=3.44.0"

  scripts:
    generate:
      steps:
        - generate:remix
        - generate:remix-chart
      description: Regenerate Remix and remix_chart sources

    generate:remix:
      exec: dart run build_runner build
      description: Regenerate Remix sources
      packageFilters:
        scope: remix
      private: true

    generate:remix-chart:
      exec: dart run build_runner build
      description: Regenerate remix_chart sources
      packageFilters:
        scope: remix_chart
      private: true

    generate:check:
      steps:
        - generate:check:remix
        - generate:check:remix-chart
      description: Regenerate committed sources and reject drift

    generate:check:remix:
      exec: dart run tool/check_generated.dart
      description: Regenerate Remix sources and reject drift
      packageFilters:
        scope: remix
      private: true

    generate:check:remix-chart:
      exec: dart run tool/check_generated.dart
      description: Regenerate remix_chart sources and reject drift
      packageFilters:
        scope: remix_chart
      private: true

    test:flutter:
      exec: flutter test --reporter=failures-only
      description: Run flutter test
      packageFilters:
        dirExists: test

    mix:consumer:check:
      run: dart run tool/check_consumer_mix.dart
      description: Verify consumer tests resolve the declared hosted Mix release

    ci:
      steps:
        - mix:consumer:check
        - generate:check
        - docs:check
        - fortal:parity:check
        - test:flutter
      description: Verify generated sources, docs, Fortal parity, and tests

    fortal:parity:check:
      exec: dart run tool/fortal_parity/check.dart
      description: Verify the pinned Radix Themes 3.3.0 parity contract and coverage
      packageFilters:
        scope: remix

    docs:check:
      exec: dart run tool/validate_docs.dart
      description: Reject retired APIs in docs and examples, then analyze MDX Dart snippets
      packageFilters:
        scope: remix
