name: remix_workspace
environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dev_dependencies:
  melos: ^8.5.0
  flutter_lints: ^6.0.0
  build_runner: ^2.10.1
  pub_semver: ^2.2.0
  test: ^1.31.0
  yaml: ^3.1.3

workspace:
  - apps/dashboard
  - apps/demo
  - apps/playground
  - packages/remix
  - packages/remix_cli
  - packages/remix_fortal
  - packages/remix_agent
  - packages/remix_agent/example
  - packages/remix_ui_icons

melos:
  packages:
    - apps/*
    - packages/*
    - packages/remix_agent/example

  # No `command.bootstrap.environment` here on purpose. It rewrites one
  # `environment:` into every package it manages, and this workspace has two
  # legitimate floors: published libraries and application-owned Fortal source
  # run on Mix's Flutter 3.41, while the dev toolchain (analyzer, via
  # build_runner) needs meta 1.18 and therefore Flutter 3.44. Melos offers no
  # per-package exemption, so a single managed value could only be wrong for
  # one group.
  # tool/check_toolchain.dart owns both floors and enforces them instead.

  command:
    version:
      # The aggregate workspace changelog is not published and duplicates the
      # per-package ones, so a `melos version` run should not create it.
      workspaceChangelog: false

    bootstrap:
      # Every dependency that more than one workspace pubspec declares takes
      # its constraint from here, so one edit plus `dart run melos bootstrap`
      # moves it everywhere; that keeps the Fortal authoring source analyzed
      # against the same Mix as Remix. Unlike `environment` above, this is safe
      # to manage centrally: melos skips any package that does not already
      # declare the dependency (see `_updateDependencies` in melos), so the
      # apps keep resolving Mix transitively and never gain a direct dependency.
      # A dependency that only one pubspec declares stays local to it.
      #
      # Bootstrap never rewrites the root pubspec, which is not a melos
      # package. tool/check_dependency_constraints.dart holds the root and
      # every member to these values, and fails on a shared dependency missing
      # from this list.
      #
      # Workspace packages are listed too. Workspace resolution always uses the
      # local source, but these hosted constraints keep each manifest
      # deployable outside the workspace. Release versioning runs with
      # `--no-dependent-constraints`, so a floor moves only when edited here.
      #
      # Keep these at the versions actually exercised by CI. Declaring an older
      # floor than we test would claim support for a Mix we never build against.
      # tool/check_consumer_mix.dart verifies the hosted Remix consumer
      # contract; Fortal registry generation copies its floors from the default
      # registry rather than publishing this internal manifest.
      dependencies:
        # beta.5 is the floor, not a preference: mix_generator 2.2.0-beta.3
        # emits `implements StylerFieldMetadata`, and that symbol first ships
        # in mix 2.2.0-beta.5. Lowering this constraint compiles here but
        # breaks any consumer that resolves beta.4.
        mix: ^2.2.0-beta.5
        mix_annotations: ^2.2.0-beta.1
        mix_chart: ^0.0.1-beta.1
        cupertino_icons: ^1.0.8
        pub_semver: ^2.2.0
        yaml: ^3.1.3
        remix: ^1.0.0-beta.10
        remix_fortal: ^1.0.0-beta.9
        remix_ui_icons: ^0.1.0
      dev_dependencies:
        build_runner: ^2.10.1
        mix_generator: ^2.2.0-beta.3
        remix_cli: ^0.1.0
        test: ^1.31.0

  scripts:
    # No `release:*` versioning scripts here on purpose. The version workflow
    # is the supported path for the published Remix package; remix_fortal is an
    # internal authoring and parity package whose source derives the bundled
    # Fortal preset, so release automation must not version it.
    generate:
      description: Regenerate Remix sources
      # remix_fortal's generator resolves package:remix, so it must not build
      # while remix is rewriting its own lib/.
      exec:
        command: dart run build_runner build
        concurrency: 1
        orderDependents: true
      packageFilters:
        scope: [remix, remix_agent, remix_fortal]

    generate:check:
      description: Regenerate Remix sources and fail only on generated drift
      exec:
        # `$MELOS_ROOT_PATH`, not a fixed `../../`: the scope below spans two
        # directory depths, and `packages/remix_agent/example` is three levels
        # down.
        command: dart run $MELOS_ROOT_PATH/tool/check_generated.dart
        concurrency: 1
        orderDependents: true
      # The playground and the Agent example are in scope because each holds a
      # committed, CLI-installed copy of registry source. Nothing renders those
      # files in the playground, so a `.g.dart` left behind by a recipe edit
      # would compile and ship green.
      packageFilters:
        scope:
          [remix, remix_agent, remix_fortal, playground, remix_agent_example]

    test:flutter:
      exec: flutter test --reporter=failures-only
      description: Run flutter test
      packageFilters:
        dirExists: test
        flutter: true

    test:cli:
      description: Run the pure-Dart remix_cli test suite
      exec:
        command: dart test
        concurrency: 1
      packageFilters:
        scope: remix_cli

    version:align:check:
      run: dart run tool/check_version_alignment.dart
      description: Verify the remix_cli registry floors at the Remix version

    mix:consumer:check:
      run: dart run tool/check_consumer_mix.dart
      description: Verify consumer tests resolve the declared hosted Mix release

    toolchain:check:
      run: dart run tool/check_toolchain.dart
      description: Verify every package declares the melos-managed toolchain floor

    material:check:
      run: dart run tool/check_material_independence.dart
      description: Verify Remix and Fortal consumer sources contain no direct Material usage

    open-code:check:
      steps:
        - dart test test/tool/check_open_code_test.dart
        - dart run tool/check_open_code.dart --source checkout
        - dart run tool/check_open_code.dart --preset fortal --source checkout
      description: Install every item from both presets against the Remix checkout

    open-code:release:check:
      steps:
        - dart run tool/check_open_code.dart --source hosted
        - dart run tool/check_open_code.dart --preset fortal --source hosted
      description: Verify both presets against the required published Remix release

    open-code:fortal:build:
      run: dart run tool/build_fortal_preset.dart
      description: Derive the Fortal registry from analyzer-checked package source

    open-code:fortal:check:
      steps:
        - dart test test/tool/build_fortal_preset_test.dart
        - dart run tool/build_fortal_preset.dart --check
      description: Test Fortal derivation and fail on committed preset drift

    open-code:dogfood:check:
      run: dart run tool/check_open_code_dogfood.dart
      description: Verify the playground's installed source still mirrors the registry

    icons:generate:
      steps:
        - uv run --frozen --project packages/remix_ui_icons/tool/radix_icons glyphpact --config packages/remix_ui_icons/tool/radix_icons/glyphpact.json
        - uv run --frozen --project packages/remix_ui_icons/tool/radix_icons python packages/remix_ui_icons/tool/radix_icons/generate_icons_index.py
      description: Regenerate the locked RemixIcons font, Dart provider, and opt-in index

    icons:check:
      steps:
        - uv run --frozen --project packages/remix_ui_icons/tool/radix_icons glyphpact --config packages/remix_ui_icons/tool/radix_icons/glyphpact.json --check
        - uv run --frozen --project packages/remix_ui_icons/tool/radix_icons python -m unittest discover -s packages/remix_ui_icons/tool/radix_icons -p 'test_*.py'
        - uv run --frozen --project packages/remix_ui_icons/tool/radix_icons python packages/remix_ui_icons/tool/radix_icons/verify.py
      description: Verify the pinned Radix snapshot, generated icon artifacts, and opt-in index

    constraints:check:
      run: dart run tool/check_dependency_constraints.dart
      description: Verify shared dependency constraints match the melos bootstrap config

    analyze:
      # The shared `dart-actions` workflow already runs an analyzer step, so
      # this is not what guards `main`. It exists so `melos run ci` -- the
      # documented local gate -- reports the same failures a pull request
      # would, instead of deferring them to a push.
      run: dart analyze
      description: Analyze every workspace package

    format:check:
      # Nothing verified formatting before this: the analyzer action does not
      # check it and no melos script did, so two committed test files had
      # drifted from the formatter. Generated sources are covered too, which
      # is why this runs after `generate:check` rather than before it.
      run: dart format --output=none --set-exit-if-changed .
      description: Verify every Dart source matches the formatter

    ci:
      steps:
        - toolchain:check
        - constraints:check
        - analyze
        - version:align:check
        - mix:consumer:check
        - material:check
        - generate:check
        - format:check
        - open-code:fortal:check
        - docs:check
        - fortal:parity:check
        - open-code:dogfood:check
        - test:cli
        - test:flutter
        # Fresh consumers use checkout Remix and hosted supporting packages.
        # The release check separately requires the published Remix version.
        - open-code:check
      description: >-
        Verify generated sources, docs, Fortal parity, tests, and the
        open-code consumer boundary

    fortal:parity:check:
      exec: dart run tool/fortal_parity/check.dart
      description: Verify the pinned Radix Themes 3.3.0 parity contract and coverage
      packageFilters:
        scope: remix_fortal

    docs:catalog:
      run: dart run tool/generate_fortal_catalog.dart
      description: Regenerate the Fortal widget catalog from the parity manifest

    docs:check:
      # The catalog is rendered from the same manifest `fortal:parity:check`
      # holds against the recipes, so a stale page is drift, not a doc edit.
      steps:
        - dart run tool/validate_docs.dart
        - dart run tool/generate_fortal_catalog.dart --check
        - python3 tool/check_tutorial_assets.py
        - python3 -m unittest discover -s tool -p 'test_tutorial_assets.py'
      description: Validate docs, reject retired APIs, and fail on catalog drift
