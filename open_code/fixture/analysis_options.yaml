# Deliberately dependency-free: adding `flutter_lints` here would add a
# development dependency that the copied payload does not need, and the
# checker asserts this fixture's dependency list exactly.
analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # The copied payload is application source; an unused import in it is a
    # copy mistake worth failing on.
    unused_import: error
    unused_element: error
  exclude:
    - build/**
    # Generated by mix_generator in the consumer. The current generator emits
    # explicit `this.` qualifiers that Flutter's default lints flag as info.
    - lib/ui/**/*.g.dart

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - unnecessary_parenthesis
